spring.application.name=ideabridge-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:ideabridgedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
jwt.secret=ideabridge-backend-secret-key-change-in-production-minimum-256-bits
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ideabridge=DEBUG
